# Gradle daemon & build settings.
#
# AGP 9.5 runs on JDK 17+; Java 21 is the documented LTS minimum.
# (The build environment ships Java 25 as the default, but 21 is
# explicitly supported by AGP 9.5 and is the documented LTS.)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Explicitly opt out of the Kotlin/Gradle compatibility checks for AGP 9.5:
# we intentionally run Gradle 9.8 (the SDK-managed version available in this
# build environment) with AGP 9.5, which is supported (AGP 9.5 requires
# Gradle >= 9.6).
kotlin.code.style=official
